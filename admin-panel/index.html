<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hlala Link · Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --blue: #0A84FF;
        --blue-dark: #005a9c;
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #1e293b;
        --muted: #64748b;
        --border: #e2e8f0;
        --green: #10b981;
        --red: #f87171;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Poppins', system-ui, sans-serif; background: var(--bg); color: var(--text); }
      .muted { color: var(--muted); }
      a { text-decoration: none; color: inherit; }
      button { cursor: pointer; }

      /* Auth window */
      .auth-window { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%); }
      .auth-card { background: var(--card); width: 100%; max-width: 420px; padding: 48px 32px; border-radius: 20px; box-shadow: 0 25px 50px rgba(0,0,0,0.15); text-align: center; }
      .auth-card h1 { font-size: 28px; margin-bottom: 4px; }
      .auth-card p { color: var(--muted); margin-bottom: 24px; }
      .auth-card input { width: 100%; height: 48px; margin: 8px 0; padding: 0 14px; border: 1px solid var(--border); border-radius: 12px; font-family: inherit; font-size: 15px; outline: none; transition: border-color .2s; }
      .auth-card input:focus { border-color: var(--blue); }
      .auth-card .btn { width: 100%; height: 48px; margin-top: 20px; background: var(--blue); color: #fff; font-family: inherit; font-weight: 600; font-size: 15px; border: none; border-radius: 12px; }
      .auth-card .btn:hover { background: var(--blue-dark); }
      .error { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; padding: 12px; border-radius: 10px; margin: 16px 0; }

      /* Shell */
      .shell { min-height: 100vh; }
      .topbar { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
      .topbar .brand { font-weight: 700; font-size: 18px; display: flex; align-items: gap: 8px; }
      .topbar .brand .mark { width: 32px; height: 32px; border-radius: 8px; background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; }
      .topbar .tabs { display: flex; gap: 4px; }
      .topbar .tab { font-family: inherit; font-weight: 500; font-size: 13px; background: transparent; border: none; color: var(--muted); padding: 8px 12px; border-radius: 8px; cursor: pointer; }
      .topbar .tab.active { background: #eff6ff; color: var(--blue); font-weight: 600; }
      .topbar .user { display: flex; align-items: center; gap: 12px; }
      .topbar .user-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
      .main { max-width: 1100px; margin: 0 auto; padding: 24px; }
      .section { display: none; }
      .section.active { display: block; }
      .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-top: 20px; }
      .card h2 { font-size: 18px; margin-bottom: 16px; }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; }
      th { color: var(--muted); text-transform: uppercase; font-size: 11px; letter-spacing: .5px; }
      .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; text-transform: capitalize; }
      .badge-admin { background: #e2e8f0; color: #1e293b; }
      .badge-agent { background: #bfdbfe; color: #1e293b; }
      .badge-mover { background: #fed7aa; color: #92400e; }
      .status { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; padding: 2px 6px; border-radius: 10px; }
      .status-approved { background: #d1fae5; color: #059669; }
      .status-pending { background: #fef3c7; color: #d97706; }
      .status-rejected { background: #fecaca; color: #b91c1c; }
      .search { width: 100%; height: 44px; padding: 0 12px; border: 1.5px solid var(--border); border-radius: 12px; font-family: inherit; font-size: 14px; outline: none; background: var(--card); margin-bottom: 12px; }
      .search:focus { border-color: var(--blue); }
      .btn-small { height: 32px; padding: 0 10px; font-size: 12px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text); }
      .btn-small.approve { background: var(--green); color: #fff; border-color: var(--green); }
      .btn-small.reject { background: var(--red); color: #fff; border-color: var(--red); }
      .empty { text-align: center; color: var(--muted); padding: 30px 0; }

      @media (max-width: 640px) { .topbar .tabs { display: none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
