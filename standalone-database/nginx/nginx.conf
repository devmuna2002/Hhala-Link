events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 100M;

    upstream postgrest {
        server rest:3000;
    }

    upstream gotrue {
        server auth:9999;
    }

    upstream storage {
        server storage:5000;
    }

    server {
        listen 8000;
        server_name localhost;

        # Global CORS Headers
        set $cors_origin "*";

        # Preflight handling
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Health check endpoint
        location = /health {
            add_header Content-Type application/json always;
            add_header Access-Control-Allow-Origin "*" always;
            return 200 '{"status":"healthy","database":"hlala-link-standalone","version":"2026.1"}\n';
        }

        # ── GoTrue Authentication: /auth/v1/* ──
        location /auth/v1/ {
            proxy_pass http://gotrue/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, apikey, prefer, x-client-info" always;
        }

        # ── PostgREST Database API: /rest/v1/* ──
        location /rest/v1/ {
            proxy_pass http://postgrest/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, apikey, prefer, x-client-info" always;
            add_header Access-Control-Expose-Headers "Content-Range, Range-Unit" always;
        }

        # ── Storage API: /storage/v1/* ──
        location /storage/v1/ {
            proxy_pass http://storage/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, apikey, prefer, x-client-info" always;
        }
    }
}
